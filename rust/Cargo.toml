[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
commanddeck-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
notify = "8"
which = "8"
dirs = "6"
log = "0.4"
env_logger = "0.11"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
