[package]
name = "agentdeck-core"
description = "Backend do AgentDeck: agentes, ponte HTTP, execução headless, mesas, workspace e transcrição."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
uuid.workspace = true
regex.workspace = true
ureq.workspace = true
tiny_http.workspace = true
notify.workspace = true
which.workspace = true
dirs.workspace = true
log.workspace = true
getrandom = "0.4"
png = "0.18"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
open = "5"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Cota do Antigravity: no Linux o `agy` guarda o token no chaveiro do sistema (Secret Service, por D-Bus). A crate é
# Rust puro (zbus), sem biblioteca C: não muda o que a CI e o README instalam. Ver `memory/LINUX.md`.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_RestartManager","Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
