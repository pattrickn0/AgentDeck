[package]
name = "holt-core"
description = "Holt backend: agents, HTTP bridge, headless runs, tasks desk, workspace and transcription."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
uuid.workspace = true
regex.workspace = true
ureq.workspace = true
tiny_http.workspace = true
notify.workspace = true
which.workspace = true
dirs.workspace = true
log.workspace = true
getrandom = "0.4"
png = "0.18"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
open = "5"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Antigravity quota: on Linux `agy` keeps the token in the system keyring (Secret Service, over D-Bus). The crate is
# pure Rust (zbus), no C library: it does not change what CI and the README install. See `memory/LINUX.md`.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_RestartManager","Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

# Fake agent of the bridge tests: a real binary instead of shell scripts, so the same
# tests run on Windows and Unix. The tests copy it to the search PATH and write the
# behavior next to it (see `tests/support/fake_agent.rs`).
[[bin]]
name = "fake_agent"
path = "tests/support/fake_agent.rs"
test = false
bench = false
doc = false

# Memory ruler (measures the learning delivery strategies over the git history). `test = true` makes
# `cargo test` run the example's unit tests.
[[example]]
name = "memeval"
test = true
