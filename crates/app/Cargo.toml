[package]
name = "commanddeck"
description = "CommandDeck Terminal — interface nativa (winit + egui) que conecta agentes de IA."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["audio"]
# Notificações sonoras e microfone (cpal). Sem ela, o som é mudo e o microfone fica indisponível.
audio = ["dep:cpal"]

[dependencies]
commanddeck-core.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
winit.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
glow.workspace = true
raw-window-handle.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_glow = { workspace = true, features = ["winit"] }
alacritty_terminal.workspace = true
portable-pty.workspace = true
rfd.workspace = true
arboard.workspace = true
png.workspace = true
chrono.workspace = true
cpal = { workspace = true, optional = true }
