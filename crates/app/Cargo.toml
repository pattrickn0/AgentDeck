[package]
name = "agentdeck"
description = "AgentDeck — interface nativa (winit + egui) que conecta agentes de IA."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["audio"]
# Notificações sonoras e microfone (cpal). Sem ela, o som é mudo e o microfone fica indisponível.
audio = ["dep:cpal"]

[dependencies]
agentdeck-core.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
winit.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
glow.workspace = true
raw-window-handle.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_glow = { workspace = true, features = ["winit"] }
alacritty_terminal.workspace = true
portable-pty.workspace = true
rfd.workspace = true
arboard.workspace = true
png.workspace = true
chrono.workspace = true
cpal = { workspace = true, optional = true }
egui_commonmark.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Ícone e dados de versão do executável no Windows (recurso embutido por `build.rs`).
winresource.workspace = true
