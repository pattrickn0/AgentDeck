name: Whisper engines

# Builds the whisper.cpp engines that upstream does not ship and attaches them, with their SHA-256, to a release of this
# repository named `whisper-engines-<whisper.cpp version>`. Today: Vulkan `whisper-cli` for Linux x86_64.
# The app (`crates/core/src/whisper.rs`, `ENGINES_RELEASE` and `VULKAN_LINUX_SHA256`) downloads the zip and pins its hash:
# after a new build, copy the hash printed by the "Checksum" step into that constant.
# See memory/learnings/linux-vulkan-engine-build.md.

on:
  workflow_dispatch:
    inputs:
      whisper_version:
        description: whisper.cpp tag to build
        default: v1.9.5
        required: true
  push:
    tags: ["whisper-engines-*"]

permissions:
  contents: write

env:
  # Pinned: the release asset (and the hash in the app) must not change under the same name by accident.
  VULKAN_SDK_VERSION: 1.4.313.0

jobs:
  vulkan-linux:
    name: Vulkan (Linux x86_64)
    # The oldest runner image: the binary needs glibc >= the one it was built with, and 22.04 (glibc 2.35) runs on
    # every current distro (Ubuntu 22.04+, Fedora, openSUSE Tumbleweed, Debian 12+).
    runs-on: ubuntu-22.04
    steps:
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ver="${GITHUB_REF_NAME#whisper-engines-}"; else ver="${{ inputs.whisper_version }}"; fi
          echo "whisper=$ver" >> "$GITHUB_OUTPUT"
          echo "release=whisper-engines-$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ steps.v.outputs.whisper }}
          path: whisper.cpp

      # Ubuntu 22.04's own Vulkan headers/glslc are too old for ggml; the LunarG SDK has current ones. They are needed
      # only here, to build: the binary loads libvulkan.so.1 from the user's system at run time.
      - name: Vulkan SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xz-utils zip libvulkan1
          curl -sSfL "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz" -o sdk.tar.xz
          mkdir "$RUNNER_TEMP/vulkan-sdk" && tar -xJf sdk.tar.xz -C "$RUNNER_TEMP/vulkan-sdk"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"

      # Static ggml/whisper, libstdc++ and libgcc, no OpenMP and no -march=native: the only run-time dependencies are
      # glibc and libvulkan.so.1. If the loader is missing the binary fails to start and the app falls back to the CPU.
      - name: Build
        working-directory: whisper.cpp
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=1 -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_SKIP_RPATH=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --target whisper-cli

      - name: Check portability
        working-directory: whisper.cpp/build/bin
        run: |
          ldd whisper-cli
          # Highest glibc symbol version the binary asks for: must stay <= 2.35.
          need=$(objdump -T whisper-cli | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ]
          # Nothing but glibc and the Vulkan loader.
          ! ldd whisper-cli | grep -E 'libstdc\+\+|libgomp|libggml|libwhisper'
          ./whisper-cli --help 2>&1 | head -5

      - name: Package
        id: pkg
        run: |
          zip_name=whisper-bin-vulkan-linux-x64.zip
          mkdir out
          cp whisper.cpp/build/bin/whisper-cli whisper.cpp/LICENSE out/
          strip out/whisper-cli
          (cd out && zip -9 "../$zip_name" whisper-cli LICENSE)
          sha256sum "$zip_name" | tee "$zip_name.sha256"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "### $zip_name" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "$zip_name.sha256" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.release }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Whisper engines ${{ steps.v.outputs.whisper }}" \
              --notes "whisper.cpp ${{ steps.v.outputs.whisper }} engines for Holt (used by crates/core/src/whisper.rs). Each zip has its .sha256."
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --repo "$GITHUB_REPOSITORY" --clobber
