name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        # No GTK: the dialogs use xdg-desktop-portal (rfd with `xdg-portal`), not GTK3.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Build without audio
        run: cargo build -p holt --no-default-features --locked
      - name: Tests
        shell: bash
        run: set -o pipefail; cargo test --workspace --locked 2>&1 | tee ci.log
      - name: Clippy
        shell: bash
        run: set -o pipefail; cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ci.log
      # The log only downloads when signed in; the annotations come from the public API (see the script).
      - name: Failure summary
        if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh ci.log

  fedora:
    name: fedora (container)
    # GitHub has no Fedora runner: a container with the README dependencies. Only build and
    # tests; formatting and clippy stay in the job above so the codebase's rustfmt deviation is not duplicated.
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: System dependencies (Fedora)
        run: dnf install -y gcc gcc-c++ git pkgconf-pkg-config alsa-lib-devel libxkbcommon-devel curl tar gzip
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Tests
        shell: bash
        run: set -o pipefail; cargo test --workspace --locked 2>&1 | tee ci.log
      - name: Failure summary
        if: failure()
        shell: bash
        run: bash scripts/ci-failure.sh ci.log
