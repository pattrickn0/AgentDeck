[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
holt-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
windows-sys = "0.61"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
notify = "8"
which = "8"
dirs = "6"
log = "0.4"
env_logger = "0.11"
tempfile = "3"

# ---------------------------------------------------------------------------
# Native UI (crate `holt`) — a separate block to make merges easier.
# ---------------------------------------------------------------------------
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.17"
raw-window-handle = "0.6"
egui = "0.36"
egui-winit = "0.36"
egui_glow = "0.36"
alacritty_terminal = "0.26"
portable-pty = "0.9"
cpal = "0.18"
rfd = "0.17"
arboard = "3"
png = "0.18"
winresource = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Markdown rendered in Documents mode (ui/docs.rs); without the highlighting, image and link features.
egui_commonmark = { version = "0.25", default-features = false }
# Tray icon: Windows (Win32, no GTK) and Linux (StatusNotifierItem over D-Bus, no GTK nor tokio).
tray-icon = { version = "0.24", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
