<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:" />
  <title>CommandDeck Terminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-wrap">
    <aside id="sidebar">
      <div id="file-tree" role="tree"></div>
    </aside>
    <div id="sidebar-splitter" title="Arraste para redimensionar barra lateral"></div>

    <div id="main-content">
      <header id="topbar">
        <button id="sidebar-toggle-btn" class="icon-tab-btn" title="Recolher barra lateral (Ctrl+B)">
          <svg id="sidebar-toggle-icon" viewBox="0 0 16 16" width="9" height="9">
            <path fill="currentColor" d="M10.354 3.646a.5.5 0 0 1 0 .708L6.707 8l3.647 3.646a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 0 1 .708 0z"/>
          </svg>
        </button>
        <nav id="tabs" role="tablist"></nav>
        <div id="new-tab-wrap">
          <button id="new-tab" title="Nova aba (Ctrl+T)">+</button>
          <div id="new-tab-menu" hidden></div>
        </div>
        <div class="spacer"></div>
        <button id="workspace" title="Pasta de trabalho dos agentes (clique para trocar)"></button>
        <div id="settings-wrap">
          <button id="settings-btn" title="Configurações">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
          <div id="settings-menu" class="settings-dropdown" hidden>
            <div class="settings-title">Configurações</div>
            <label class="settings-item">
              <span>Sons de notificação</span>
              <input type="checkbox" id="setting-sound" checked />
            </label>
            <button id="setting-test-sound" class="settings-action-btn">▶ Testar som</button>
          </div>
        </div>
      </header>

      <main id="terminals">
        <div id="terminals-empty" class="terminals-empty" hidden>
          <div class="empty-state-card">
            <div class="empty-state-icon">
              <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-2-1h-4v-2h4v2zm-6.29-2.71a.996.996 0 0 0 0-1.41L9.42 11.6l2.3-2.3a.996.996 0 1 0-1.41-1.41L7.59 10.6c-.39.39-.39 1.02 0 1.41l2.71 2.71c.39.39 1.02.39 1.41-.01z"/></svg>
            </div>
            <h3>Nenhum agente aberto</h3>
            <p>Selecione um agente abaixo ou clique no <strong>+</strong> acima para iniciar uma sessão:</p>
            <div class="empty-state-actions" id="empty-state-actions"></div>
          </div>
        </div>
      </main>

      <div id="splitter" title="Arraste para redimensionar"></div>

      <section id="bottom">
        <div id="feed-head">
          <button id="feed-toggle" aria-expanded="true">▾ Conversa integrada</button>
          <span id="feed-badge" hidden></span>
          <div class="spacer"></div>
          <button id="feed-clear" class="ghost">Limpar</button>
        </div>
        <div id="feed" aria-live="polite">
          <div class="empty">Aqui aparecem as conversas entre os agentes (via <code>ask-agent</code>) e as mesas de orquestração.</div>
        </div>

        <div id="composer">
          <div id="composer-opts">
            <label>Enviar para
              <select id="target">
                <option value="active">Aba ativa</option>
                <option value="all">Todos os agentes abertos</option>
              </select>
            </label>
            <label id="rounds-wrap" hidden>Rodadas
              <input id="rounds" type="number" min="1" max="6" value="2" />
            </label>
            <div id="chips"></div>
          </div>
          <div id="composer-row">
            <textarea id="input" rows="2" placeholder="Escreva um comando ou mensagem…  (Enter envia, Shift+Enter quebra linha)"></textarea>
            <div id="mic-wrap">
              <button id="mic-cancel" class="icon" title="Cancelar gravação" hidden>
                <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
              </button>
              <button id="mic" class="icon" title="Gravar áudio">
                <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
              </button>
            </div>
            <button id="attach" class="icon" title="Anexar arquivos">
              <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5H9v9a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v11.5a6 6 0 0 0 12 0v-10h-1.5Z"/></svg>
            </button>
            <button id="send" class="primary">Enviar</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="drop-overlay" hidden>
    <div class="drop-box">
      <svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <div class="drop-title">Solte arquivos ou imagens aqui</div>
      <div class="drop-subtitle">Eles serão anexados automaticamente à sua mensagem</div>
    </div>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
